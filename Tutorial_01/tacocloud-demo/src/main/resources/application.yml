server:
  port: 8081   # 8080 is often taken by other local services (e.g. Apache, other apps)

spring:
  datasource:
    url: jdbc:h2:mem:tacodb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update   # auto-creates the Taco table from the @Entity class
    show-sql: true        # prints generated SQL to the console — handy for learning
  h2:
    console:
      enabled: true        # visit http://localhost:8081/h2-console in a browser
      path: /h2-console
