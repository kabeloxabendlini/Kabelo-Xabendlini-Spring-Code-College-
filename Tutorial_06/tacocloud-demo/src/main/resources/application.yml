server:
  port: 8081   # 8080 is often taken by other local services (e.g. Apache, other apps)

spring:
  datasource:
    url: jdbc:h2:mem:tacodb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html   # visit http://localhost:8081/swagger-ui.html
  api-docs:
    path: /v3/api-docs        # raw OpenAPI JSON spec, if you ever want to import it elsewhere
